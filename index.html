<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- stylesheet -->
    <link rel="stylesheet" href="css/style.css">
   
    <!-- font  -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    
    <!-- chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- sweet alert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>ProductHub</title>
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <i class="fa-solid fa-briefcase"></i>
            <h2>ProductHub</h2>
        </div>
        <p>MAIN</p>
        <div class="main">
            <div class="nav-link active">
                <i class="fa-solid fa-home"></i>
                <span>Home</span>
            </div>
            <div class="nav-link">
                <i class="fa-solid fa-box"></i>
                <span>Products</span>
            </div>
            <div class="nav-link">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>Orders</span>     
            </div>
            <div class="nav-link">
                <i class="fa-solid fa-users"></i>
                <span>Customers</span>
            </div>
        </div>
        <p>MANAGEMENT</p>
        <div class="management">
            <div class="nav-link">
                <i class="fa-solid fa-warehouse"></i>
                <span>Inventory</span>
            </div>
            <div class="nav-link">
                <i class="fa-solid fa-percent"></i>
                <span>Discounts</span>
            </div>
            <div class="nav-link">
                <i class="fa-solid fa-star"></i>
                <span>Reviews</span>
            </div>
        </div>
        <p>SETTINGS</p>
        <div class="settings">
            <div class="nav-link">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
            </div>
            <div class="nav-link">
                <i class="fa-solid fa-users"></i>
                <span>Users</span>  
            </div>
        </div>  
        
        
        <div class="logout">
            <div class="nav-link">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>  
        </div>


    </aside>

    <aside class="dashboard">

        <header>
            <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">
                <i class="fa-solid fa-bars"></i>
            </button>
            <h2 id="page-title">Home</h2>
            <div class="profile" id="profile-menu">
                <img src="assets/images/photo_2026-07-12_09-52-53.jpg" alt="profile-img">
                <div class="profile-info">
                    <h3>Mahmoud</h3>
                    <p>Admin</p>   
                </div> 
                <i class="fa-solid fa-chevron-down" id="profile-chevron"></i>

                <div class="profile-dropdown" id="profile-dropdown">
                    <button class="dropdown-item" data-action="profile">
                        <i class="fa-solid fa-user"></i> My Profile
                    </button>
                    <button class="dropdown-item" data-action="settings">
                        <i class="fa-solid fa-gear"></i> Settings
                    </button>
                    <div class="dropdown-divider"></div>
                    <button class="dropdown-item danger" data-action="logout">
                        <i class="fa-solid fa-right-from-bracket"></i> Sign Out
                    </button>
                </div>
            </div>
    
        </header>

        <section class="dashboard-content">

        </section>

        <div class="product-modal">

    <div class="modal-overlay"></div>

    <div class="modal-content">

        <div class="modal-header">
            <h2>Add New Product</h2>

            <button class="close-modal">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <form id="add-product-form">

            <div class="form-group">
                <label for="product-name">Product Name</label>
                <input 
                    type="text" 
                    id="product-name"
                    placeholder="e.g. MacBook Pro 14"
                    required
                >
            </div>

            <div class="form-group">
                <label for="product-category">Category</label>
                <select id="product-category" required>
                    <option value="">Select category</option>
                    <option value="Laptops">Laptops</option>
                    <option value="Smartphones">Smartphones</option>
                    <option value="Headphones">Headphones</option>
                    <option value="Tablets">Tablets</option>
                    <option value="Accessories">Accessories</option>
                    <option value="Smartwatches">Smartwatches</option>
                </select>
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="product-price">Price</label>
                    <input 
                        type="number"
                        id="product-price"
                        placeholder="999"
                        min="0"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="product-stock">Stock</label>
                    <input 
                        type="number"
                        id="product-stock"
                        placeholder="20"
                        min="0"
                        required
                    >
                </div>

            </div>

            <div class="form-group">
                <label for="product-image">Image URL</label>
                <input 
                    type="text"
                    id="product-image"
                    placeholder="assets/images/product.jpg"
                    required
                >
            </div>

            <div class="modal-actions">
                <button type="button" class="cancel-btn">
                    Cancel
                </button>

                <button type="submit" class="save-product-btn">
                    Add Product
                </button>
            </div>

        </form>

    </div>
</div>

    </aside>

    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
        
    
    <script src="js/script.js"></script>
</body>
</html>
